name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Show resolved versions
        run: python -c "import sys, PIL; print(sys.version); print('Pillow', PIL.__version__)"
      - name: Check WebP support
        run: python -c "from PIL import features; assert features.check('webp'), 'Pillow built without WebP'"
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v

  docker:
    name: docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build current image
        run: docker build -t convert-webp-cui:ci .
      - name: Run current image
        run: docker run --rm convert-webp-cui:ci
