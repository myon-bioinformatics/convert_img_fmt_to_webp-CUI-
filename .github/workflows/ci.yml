name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vendor-mode:
        description: Public vendor placement mode for this CI run
        type: choice
        options: [update, locked]
        default: update

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 08dc3757deeb930c950bdcc6bd55ec3112ba49fc
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Verify checked-in vendor copies
        run: python -S .vendor-sync-tools/vendor_sync.py check
      - name: Recreate locked vendor files from GitHub
        shell: bash
        run: |
          python -S - <<'PY'
          from pathlib import Path
          for name in ('xprobe_pytest.py', 'xprobe-LICENSE', 'gh_identity.py', 'gh_identity-LICENSE'):
              Path('scripts', name).unlink()
          PY
          python -S .vendor-sync-tools/vendor_sync.py materialize
          python -S .vendor-sync-tools/vendor_sync.py check
      - name: Update public vendor files for this run
        shell: bash
        if: inputs.vendor-mode != 'locked'
        run: |
          python -S .vendor-sync-tools/vendor_sync.py promote --manifest vendor.lock.json | tee vendor-promotion.json
          python -S -m json.tool vendor-promotion.json > /dev/null
          python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Preserve resolved vendor snapshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-snapshot
          path: |
            vendor.lock.json
            ${{ inputs.vendor-mode != 'locked' && 'vendor-promotion.json' || '' }}
            scripts/xprobe_pytest.py
            scripts/xprobe-LICENSE
            scripts/gh_identity.py
            scripts/gh_identity-LICENSE
          if-no-files-found: error
          retention-days: 14

  test:
    needs: resolve-vendor
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            tests/requirements.txt
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r tests/requirements.txt
      - name: Fetch pinned shared vendor tool
        uses: actions/checkout@v7
        with:
          repository: myon-bioinformatics/myon-bioinformatics
          ref: 08dc3757deeb930c950bdcc6bd55ec3112ba49fc
          path: .vendor-sync-tools
          persist-credentials: false
      - name: Download resolved vendor snapshot
        uses: actions/download-artifact@v8
        with:
          name: vendor-snapshot
          path: .
      - name: Verify resolved vendor snapshot
        run: python -S .vendor-sync-tools/vendor_sync.py check --manifest vendor.lock.json
      - name: Verify enrolled GHI is stdlib-loadable
        run: python -S -c "import importlib.util; s=importlib.util.spec_from_file_location('sandbox_ghi','scripts/gh_identity.py'); m=importlib.util.module_from_spec(s); s.loader.exec_module(m); assert hasattr(m,'capabilities')"
      - name: Show resolved versions
        run: python -c "import sys, PIL; print(sys.version); print('Pillow', PIL.__version__)"
      - name: Check WebP support
        run: python -c "from PIL import features; assert features.check('webp'), 'Pillow built without WebP'"
      - name: Run conversion tests with JUnit and native observations
        run: >-
          python -m pytest -p scripts.xprobe_pytest -q tests
          --junitxml=reports/pytest-${{ matrix.python-version }}.xml
          --xprobe-jsonl=reports/pytest-events-${{ matrix.python-version }}.jsonl
          --xprobe-repository=myon-bioinformatics/convert_img_fmt_to_webp-CUI-
          --xprobe-run-id=py${{ matrix.python-version }}
      - name: Preserve raw JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-py${{ matrix.python-version }}
          path: reports/pytest-${{ matrix.python-version }}.xml
          if-no-files-found: error
          retention-days: 14
      - name: Preserve native pytest observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-native-py${{ matrix.python-version }}
          path: reports/pytest-events-${{ matrix.python-version }}.jsonl
          if-no-files-found: error
          retention-days: 14

      - name: Preserve vendor lock used by this run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vendor-lock-py${{ matrix.python-version }}
          path: |
            vendor.lock.json
            ${{ inputs.vendor-mode != 'locked' && 'vendor-promotion.json' || '' }}
            scripts/xprobe_pytest.py
            scripts/xprobe-LICENSE
            scripts/gh_identity.py
            scripts/gh_identity-LICENSE
          if-no-files-found: error
          retention-days: 14

  failure-identity:
    needs: test
    if: always()
    permissions:
      contents: read
      actions: read
    uses: myon-bioinformatics/myon-bioinformatics/.github/workflows/reusable-junit-identity.yml@4dfda95d6573250477f991a0421fa6acb9bc0258
    with:
      expected-reports: '["junit-py3.10/pytest-3.10.xml","junit-py3.12/pytest-3.12.xml","junit-py3.14/pytest-3.14.xml"]'
      artifact-pattern: "junit-py*"
      output-artifact: failure-identity

  docker:
    name: docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build current image
        run: docker build -t convert-webp-cui:ci .
      - name: Verify test tooling is absent from runtime image
        run: docker run --rm convert-webp-cui:ci python -c "import importlib.util; assert importlib.util.find_spec('pytest') is None"
      - name: Run current image
        run: docker run --rm convert-webp-cui:ci
      - name: Test conversion inside current image
        run: docker run --rm convert-webp-cui:ci python -m unittest discover -s tests -v
